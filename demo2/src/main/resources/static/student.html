<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>学生信息展示</title>
    <style>
        body {
            font-family: "Microsoft YaHei", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
            background-color: #f5f5f5;
        }
        h1 {
            color: #333;
        }
        table {
            border-collapse: collapse;
            width: 80%;
            max-width: 900px;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px 16px;
            text-align: center;
        }
        th {
            background-color: #409EFF;
            color: #fff;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        tr:hover {
            background-color: #ecf5ff;
        }
        .error {
            color: #f56c6c;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>学生信息列表</h1>
    <table>
        <thead>
            <tr>
                <th>学号</th>
                <th>姓名</th>
                <th>班级</th>
                <th>学院</th>
                <th>专业</th>
            </tr>
        </thead>
        <tbody id="studentBody"></tbody>
    </table>
    <p class="error" id="error"></p>

    <script>
        fetch('/students/show')
            .then(response => response.json())
            .then(data => {
                const tbody = document.getElementById('studentBody');
                data.forEach(s => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${s.id}</td>
                        <td>${s.name}</td>
                        <td>${s.className}</td>
                        <td>${s.college}</td>
                        <td>${s.major}</td>
                    `;
                    tbody.appendChild(row);
                });
            })
            .catch(err => {
                document.getElementById('error').textContent = '加载数据失败: ' + err;
            });
    </script>
</body>
</html>
