<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>课程信息展示</title>
    <style>
        body {
            font-family: "Microsoft YaHei", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
            background-color: #f5f5f5;
        }
        h1 {
            color: #333;
        }
        table {
            border-collapse: collapse;
            width: 90%;
            max-width: 1100px;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px 16px;
            text-align: center;
        }
        th {
            background-color: #67C23A;
            color: #fff;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        tr:hover {
            background-color: #f0f9eb;
        }
        .error {
            color: #f56c6c;
            margin-top: 20px;
        }
        .search-box {
            margin-bottom: 20px;
            width: 90%;
            max-width: 1100px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: nowrap;
        }
        .search-box label {
            display: flex;
            align-items: center;
            font-size: 14px;
            color: #606266;
            white-space: nowrap;
        }
        .search-box input {
            width: 160px;
            padding: 8px 12px;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            font-size: 14px;
        }
        .search-box button {
            padding: 8px 16px;
            background-color: #67C23A;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
        }
        .search-box button:hover {
            background-color: #85ce61;
        }
        .add-btn {
            margin-left: auto;
            padding: 8px 20px;
            background-color: #E6A23C;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
        }
        .add-btn:hover {
            background-color: #ebb563;
        }
        .delete-btn {
            padding: 6px 12px;
            background-color: #F56C6C;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
        }
        .operation-col {
            white-space: nowrap;
            width: 110px;
        }
        .delete-btn:hover {
            background-color: #f78989;
        }
        /* 模态框遮罩 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        /* 模态框 */
        .modal {
            background: #fff;
            border-radius: 8px;
            width: 480px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .modal-header {
            background-color: #67C23A;
            color: #fff;
            padding: 16px 24px;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-header .close-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            line-height: 1;
        }
        .modal-header .close-btn:hover {
            opacity: 0.8;
        }
        .modal-body {
            padding: 24px;
        }
        .form-group {
            margin-bottom: 18px;
            display: flex;
            align-items: center;
        }
        .form-group label {
            width: 80px;
            font-size: 14px;
            color: #606266;
            text-align: right;
            margin-right: 12px;
            white-space: nowrap;
        }
        .form-group input,
        .form-group textarea {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #67C23A;
            box-shadow: 0 0 0 2px rgba(103,194,58,0.2);
        }
        .form-group .required::before {
            content: '*';
            color: #f56c6c;
            margin-right: 2px;
        }
        .modal-footer {
            padding: 0 24px 24px;
            text-align: right;
        }
        .modal-footer button {
            padding: 10px 24px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-left: 12px;
        }
        .modal-footer .btn-submit {
            background-color: #67C23A;
            color: #fff;
        }
        .modal-footer .btn-submit:hover {
            background-color: #85ce61;
        }
        .modal-footer .btn-cancel {
            background-color: #f5f5f5;
            color: #606266;
        }
        .modal-footer .btn-cancel:hover {
            background-color: #e8e8e8;
        }
    </style>
</head>
<body>
    <h1>课程信息列表</h1>
    <div class="search-box">
        <label for="searchCourseNo">课程编号：</label>
        <input type="text" id="searchCourseNo" placeholder="请输入课程编号">
        <label for="searchCourseName">课程名称：</label>
        <input type="text" id="searchCourseName" placeholder="请输入课程名称">
        <button type="button" onclick="searchCourse()">查询</button>
        <button type="button" onclick="clearSearch()" style="background-color: #909399;">清除</button>
        <button type="button" class="add-btn" onclick="openAddModal()">新增课程</button>
    </div>

    <!-- 新增课程模态框 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <span>新增课程信息</span>
                <button type="button" class="close-btn" onclick="closeAddModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="required" for="addCourseNo">课程编号：</label>
                    <input type="text" id="addCourseNo" name="courseNo" placeholder="请输入课程编号">
                </div>
                <div class="form-group">
                    <label class="required" for="addCourseName">课程名称：</label>
                    <input type="text" id="addCourseName" name="courseName" placeholder="请输入课程名称">
                </div>
                <div class="form-group">
                    <label for="addClassHours">学时：</label>
                    <input type="number" id="addClassHours" name="classHours" placeholder="请输入学时">
                </div>
                <div class="form-group">
                    <label for="addNote">备注：</label>
                    <textarea id="addNote" name="note" placeholder="请输入备注信息"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-cancel" onclick="closeAddModal()">取消</button>
                <button type="button" class="btn-submit" onclick="submitCourse()">确定</button>
            </div>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th scope="col">课程编号</th>
                <th scope="col">课程名称</th>
                <th scope="col">学时</th>
                <th scope="col">备注</th>
                <th scope="col" class="operation-col">操作</th>
            </tr>
        </thead>
        <tbody id="courseBody"></tbody>
    </table>
    <p class="error" id="error"></p>

    <script>
        function renderCourse(c) {
            return `
                <td>${c.courseNo}</td>
                <td>${c.courseName}</td>
                <td>${c.classHours}</td>
                <td>${c.note}</td>
                <td class="operation-col"><button type="button" class="delete-btn" onclick="deleteCourse('${c.courseNo}')">删除课程</button></td>
            `;
        }

        function loadAll() {
            document.getElementById('error').textContent = '';
            fetch('/course/show')
                .then(response => response.json())
                .then(data => {
                    const tbody = document.getElementById('courseBody');
                    tbody.innerHTML = '';
                    data.forEach(c => {
                        const row = document.createElement('tr');
                        row.innerHTML = renderCourse(c);
                        tbody.appendChild(row);
                    });
                })
                .catch(err => {
                    document.getElementById('error').textContent = '加载数据失败: ' + err;
                });
        }

        function clearSearch() {
            document.getElementById('searchCourseNo').value = '';
            document.getElementById('searchCourseName').value = '';
            loadAll();
        }

        function searchCourse() {
            const courseNo = document.getElementById('searchCourseNo').value.trim();
            const courseName = document.getElementById('searchCourseName').value.trim();
            if (!courseNo && !courseName) {
                alert('请输入查询条件');
                return;
            }
            document.getElementById('error').textContent = '';
            const params = new URLSearchParams();
            if (courseNo) params.append('courseNo', courseNo);
            if (courseName) params.append('courseName', courseName);
            fetch('/course/search?' + params.toString())
                .then(response => response.json())
                .then(data => {
                    const tbody = document.getElementById('courseBody');
                    tbody.innerHTML = '';
                    if (data && data.length > 0) {
                        data.forEach(c => {
                            const row = document.createElement('tr');
                            row.innerHTML = renderCourse(c);
                            tbody.appendChild(row);
                        });
                    } else {
                        document.getElementById('error').textContent = '未找到该课程';
                    }
                })
                .catch(err => {
                    document.getElementById('error').textContent = '查询失败: ' + err;
                });
        }

        function openAddModal() {
            document.getElementById('modalOverlay').classList.add('active');
            document.getElementById('addCourseNo').value = '';
            document.getElementById('addCourseName').value = '';
            document.getElementById('addClassHours').value = '';
            document.getElementById('addNote').value = '';
            document.getElementById('error').textContent = '';
        }

        function closeAddModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        function submitCourse() {
            const courseNo = document.getElementById('addCourseNo').value.trim();
            const courseName = document.getElementById('addCourseName').value.trim();
            const classHours = document.getElementById('addClassHours').value.trim();
            const note = document.getElementById('addNote').value.trim();

            if (!courseNo) {
                alert('请输入课程编号');
                return;
            }
            if (!courseName) {
                alert('请输入课程名称');
                return;
            }

            document.getElementById('error').textContent = '';

            const params = new URLSearchParams();
            params.append('courseNo', courseNo);
            params.append('courseName', courseName);
            if (classHours) params.append('classHours', classHours);
            if (note) params.append('note', note);

            fetch('/course/add', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: params.toString()
            })
            .then(response => {
                if (response.ok) {
                    alert('新增课程成功');
                    closeAddModal();
                    loadAll();
                } else {
                    return response.text().then(text => {
                        throw new Error(text || '新增失败');
                    });
                }
            })
            .catch(err => {
                document.getElementById('error').textContent = '新增课程失败: ' + err.message;
            });
        }

        function deleteCourse(courseNo) {
            if (!courseNo) {
                alert('课程编号不能为空');
                return;
            }

            if (!confirm('确定要删除课程 ' + courseNo + ' 吗？')) {
                return;
            }

            document.getElementById('error').textContent = '';

            fetch('/course/delete?courseNo=' + encodeURIComponent(courseNo), {
                method: 'DELETE'
            })
            .then(response => {
                if (!response.ok) {
                    return response.text().then(text => {
                        throw new Error(text || '删除失败');
                    });
                }
                return response.json();
            })
            .then(data => {
                if (data.code === 1) {
                    alert(data.data || '删除课程成功');
                    loadAll();
                } else {
                    document.getElementById('error').textContent = data.msg || '删除课程失败';
                }
            })
            .catch(err => {
                document.getElementById('error').textContent = '删除课程失败: ' + err.message;
            });
        }

        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) {
                closeAddModal();
            }
        });

        loadAll();
    </script>
</body>
</html>
