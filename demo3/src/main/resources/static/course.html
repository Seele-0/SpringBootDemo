<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>课程信息展示</title>
    <style>
        body {
            font-family: "Microsoft YaHei", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
            background-color: #f5f5f5;
        }
        h1 {
            color: #333;
        }
        table {
            border-collapse: collapse;
            width: 90%;
            max-width: 1100px;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px 16px;
            text-align: center;
        }
        th {
            background-color: #67C23A;
            color: #fff;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        tr:hover {
            background-color: #f0f9eb;
        }
        .error {
            color: #f56c6c;
            margin-top: 20px;
        }
        .search-box {
            margin-bottom: 20px;
            width: 90%;
            max-width: 1100px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: nowrap;
        }
        .search-box label {
            display: flex;
            align-items: center;
            font-size: 14px;
            color: #606266;
            white-space: nowrap;
        }
        .search-box input {
            width: 160px;
            padding: 8px 12px;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            font-size: 14px;
        }
        .search-box button {
            padding: 8px 16px;
            background-color: #67C23A;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
        }
        .search-box button:hover {
            background-color: #85ce61;
        }
    </style>
</head>
<body>
    <h1>课程信息列表</h1>
    <div class="search-box">
        <label for="searchCourseNo">课程编号：</label>
        <input type="text" id="searchCourseNo" placeholder="请输入课程编号">
        <label for="searchCourseName">课程名称：</label>
        <input type="text" id="searchCourseName" placeholder="请输入课程名称">
        <button onclick="searchCourse()">查询</button>
        <button onclick="clearSearch()" style="background-color: #909399;">清除</button>
    </div>
    <table>
        <thead>
            <tr>
                <th>课程编号</th>
                <th>课程名称</th>
                <th>学时</th>
                <th>备注</th>
            </tr>
        </thead>
        <tbody id="courseBody"></tbody>
    </table>
    <p class="error" id="error"></p>

    <script>
        function renderCourse(c) {
            return `
                <td>${c.courseNo}</td>
                <td>${c.courseName}</td>
                <td>${c.classHours}</td>
                <td>${c.note}</td>
            `;
        }

        function loadAll() {
            document.getElementById('error').textContent = '';
            fetch('/course/show')
                .then(response => response.json())
                .then(data => {
                    const tbody = document.getElementById('courseBody');
                    tbody.innerHTML = '';
                    data.forEach(c => {
                        const row = document.createElement('tr');
                        row.innerHTML = renderCourse(c);
                        tbody.appendChild(row);
                    });
                })
                .catch(err => {
                    document.getElementById('error').textContent = '加载数据失败: ' + err;
                });
        }

        function clearSearch() {
            document.getElementById('searchCourseNo').value = '';
            document.getElementById('searchCourseName').value = '';
            loadAll();
        }

        function searchCourse() {
            const courseNo = document.getElementById('searchCourseNo').value.trim();
            const courseName = document.getElementById('searchCourseName').value.trim();
            if (!courseNo && !courseName) {
                alert('请输入查询条件');
                return;
            }
            document.getElementById('error').textContent = '';
            const params = new URLSearchParams();
            if (courseNo) params.append('courseNo', courseNo);
            if (courseName) params.append('courseName', courseName);
            fetch('/course/search?' + params.toString())
                .then(response => response.json())
                .then(data => {
                    const tbody = document.getElementById('courseBody');
                    tbody.innerHTML = '';
                    if (data && data.length > 0) {
                        data.forEach(c => {
                            const row = document.createElement('tr');
                            row.innerHTML = renderCourse(c);
                            tbody.appendChild(row);
                        });
                    } else {
                        document.getElementById('error').textContent = '未找到该课程';
                    }
                })
                .catch(err => {
                    document.getElementById('error').textContent = '查询失败: ' + err;
                });
        }

        loadAll();
    </script>
</body>
</html>
