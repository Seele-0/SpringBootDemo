<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课程信息展示</title>
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background: #f5f7fa;
            color: #303133;
        }

        #app {
            min-height: 100vh;
            padding: 40px 24px;
        }

        .page-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .page-header {
            margin-bottom: 20px;
            text-align: center;
        }

        .page-header h1 {
            margin: 0 0 8px;
            font-size: 28px;
            font-weight: 700;
            color: #303133;
        }

        .toolbar-card {
            margin-bottom: 16px;
        }

        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }

        .search-form {
            flex: 1;
            min-width: 280px;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: nowrap;
        }

        .button-placeholder {
            visibility: hidden;
            pointer-events: none;
        }

        .course-table:not(.batch-mode) .el-table-column--selection .cell {
            visibility: hidden;
        }

        .table-card {
            overflow: hidden;
        }

        .pagination-wrapper {
            margin-top: 18px;
            text-align: center;
        }

        .pagination-wrapper .el-pagination {
            justify-content: center;
        }

        .error-text {
            margin-top: 16px;
            color: #f56c6c;
            text-align: center;
        }

        .course-dialog .el-input,
        .course-dialog .el-input-number,
        .course-dialog .el-textarea {
            width: 100%;
        }

        .course-dialog .el-input-number .el-input__inner {
            text-align: left;
        }

        @media (max-width: 768px) {
            #app {
                padding: 24px 12px;
            }

            .toolbar {
                align-items: stretch;
            }

            .search-form,
            .action-buttons,
            .action-buttons .el-button {
                width: 100%;
            }

            .action-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
<div id="app">
    <div class="page-container">
        <div class="page-header">
            <h1>课程信息列表</h1>
        </div>

        <el-card class="toolbar-card" shadow="never">
            <div class="toolbar">
                <el-form class="search-form" :inline="true" :model="searchForm" label-width="82px">
                    <el-form-item label="课程编号">
                        <el-input
                            v-model.trim="searchForm.courseNo"
                            placeholder="请输入课程编号"
                            clearable
                            @keyup.enter="searchCourse">
                        </el-input>
                    </el-form-item>
                    <el-form-item label="课程名称">
                        <el-input
                            v-model.trim="searchForm.courseName"
                            placeholder="请输入课程名称"
                            clearable
                            @keyup.enter="searchCourse">
                        </el-input>
                    </el-form-item>
                    <el-form-item>
                        <el-button type="success" :loading="loading" @click="searchCourse">查询</el-button>
                        <el-button @click="clearSearch">清除</el-button>
                    </el-form-item>
                </el-form>

                <div class="action-buttons">
                    <el-button type="warning" @click="openAddDialog">新增课程</el-button>
                    <el-button :type="batchMode ? 'warning' : 'danger'" @click="handleBatchBtn">
                        {{ batchMode ? '确认删除' : '批量删除' }}
                    </el-button>
                    <el-button :class="{ 'button-placeholder': !batchMode }" @click="toggleBatchMode">取消</el-button>
                </div>
            </div>
        </el-card>

        <el-card class="table-card" shadow="never">
            <el-table
                v-loading="loading"
                class="course-table"
                :class="{ 'batch-mode': batchMode }"
                :data="courses"
                border
                stripe
                style="width: 100%"
                empty-text="暂无课程数据"
                @selection-change="handleSelectionChange">
                <el-table-column type="selection" width="55" align="center"></el-table-column>
                <el-table-column prop="courseNo" label="课程编号" min-width="140" align="center"></el-table-column>
                <el-table-column prop="courseName" label="课程名称" min-width="160" align="center"></el-table-column>
                <el-table-column prop="classHours" label="学时" width="100" align="center">
                    <template #default="scope">
                        {{ scope.row.classHours || '-' }}
                    </template>
                </el-table-column>
                <el-table-column prop="note" label="备注" min-width="220" show-overflow-tooltip>
                    <template #default="scope">
                        {{ scope.row.note || '-' }}
                    </template>
                </el-table-column>
                <el-table-column label="操作" width="120" align="center" fixed="right">
                    <template #default="scope">
                        <el-button type="danger" size="small" @click="deleteCourse(scope.row.courseNo)">删除课程</el-button>
                    </template>
                </el-table-column>
            </el-table>

            <div class="pagination-wrapper" v-if="!searching">
                <el-pagination
                    background
                    layout="prev, pager, next, total"
                    :current-page="currentPage"
                    :page-size="pageSize"
                    :total="total"
                    @current-change="loadAll">
                </el-pagination>
            </div>

            <p v-if="error" class="error-text">{{ error }}</p>
        </el-card>

        <el-dialog
            v-model="dialogVisible"
            class="course-dialog"
            title="新增课程信息"
            width="480px"
            :close-on-click-modal="false"
            @closed="resetAddForm">
            <el-form ref="addFormRef" :model="addForm" :rules="addRules" label-width="90px">
                <el-form-item label="课程编号" prop="courseNo">
                    <el-input v-model.trim="addForm.courseNo" placeholder="请输入课程编号"></el-input>
                </el-form-item>
                <el-form-item label="课程名称" prop="courseName">
                    <el-input v-model.trim="addForm.courseName" placeholder="请输入课程名称"></el-input>
                </el-form-item>
                <el-form-item label="学时" prop="classHours">
                    <el-input-number v-model="addForm.classHours" :min="0" :controls="false" placeholder="请输入学时"></el-input-number>
                </el-form-item>
                <el-form-item label="备注" prop="note">
                    <el-input v-model.trim="addForm.note" type="textarea" :rows="3" placeholder="请输入备注信息"></el-input>
                </el-form-item>
            </el-form>
            <template #footer>
                <el-button @click="dialogVisible = false">取消</el-button>
                <el-button type="success" :loading="submitLoading" @click="submitCourse">确定</el-button>
            </template>
        </el-dialog>
    </div>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="https://unpkg.com/element-plus/dist/index.full.js"></script>
<script>
    const { createApp, ref, reactive, onMounted } = Vue;
    const { ElMessage, ElMessageBox } = ElementPlus;

    createApp({
        setup() {
            const pageSize = 10;
            const currentPage = ref(1);
            const total = ref(0);
            const courses = ref([]);
            const selectedCourses = ref([]);
            const loading = ref(false);
            const submitLoading = ref(false);
            const batchMode = ref(false);
            const searching = ref(false);
            const error = ref('');
            const dialogVisible = ref(false);
            const addFormRef = ref(null);

            const searchForm = reactive({
                courseNo: '',
                courseName: ''
            });

            const addForm = reactive({
                courseNo: '',
                courseName: '',
                classHours: null,
                note: ''
            });

            const addRules = {
                courseNo: [{ required: true, message: '请输入课程编号', trigger: 'blur' }],
                courseName: [{ required: true, message: '请输入课程名称', trigger: 'blur' }],
                classHours: [{ required: true, message: '请输入学时', trigger: 'blur' }]
            };

            function setError(message) {
                error.value = message || '';
            }

            async function loadAll(page = currentPage.value) {
                loading.value = true;
                searching.value = false;
                setError('');
                try {
                    const response = await fetch('/course/page?page=' + page);
                    const result = await response.json();
                    if (result.code !== 1) {
                        setError(result.msg || '加载数据失败');
                        return;
                    }

                    const pageResult = result.data || { total: 0, records: [] };
                    courses.value = pageResult.records || [];
                    total.value = pageResult.total || 0;
                    currentPage.value = page;
                } catch (err) {
                    setError('加载数据失败: ' + err.message);
                } finally {
                    loading.value = false;
                }
            }

            async function searchCourse() {
                const courseNo = searchForm.courseNo.trim();
                const courseName = searchForm.courseName.trim();
                if (!courseNo && !courseName) {
                    ElMessage.warning('请输入查询条件');
                    return;
                }

                loading.value = true;
                searching.value = true;
                setError('');
                try {
                    const params = new URLSearchParams();
                    if (courseNo) params.append('courseNo', courseNo);
                    if (courseName) params.append('courseName', courseName);

                    const response = await fetch('/course/search?' + params.toString());
                    const data = await response.json();
                    courses.value = Array.isArray(data) ? data : [];
                    total.value = courses.value.length;
                    currentPage.value = 1;

                    if (courses.value.length === 0) {
                        setError('未找到该课程');
                    }
                } catch (err) {
                    setError('查询失败: ' + err.message);
                } finally {
                    loading.value = false;
                }
            }

            function clearSearch() {
                searchForm.courseNo = '';
                searchForm.courseName = '';
                loadAll(1);
            }

            function openAddDialog() {
                setError('');
                dialogVisible.value = true;
            }

            function resetAddForm() {
                addForm.courseNo = '';
                addForm.courseName = '';
                addForm.classHours = null;
                addForm.note = '';
                if (addFormRef.value) {
                    addFormRef.value.clearValidate();
                }
            }

            async function submitCourse() {
                if (!addFormRef.value) return;

                await addFormRef.value.validate(async (valid) => {
                    if (!valid) return;

                    submitLoading.value = true;
                    setError('');
                    try {
                        const params = new URLSearchParams();
                        params.append('courseNo', addForm.courseNo.trim());
                        params.append('courseName', addForm.courseName.trim());
                        if (addForm.classHours !== null && addForm.classHours !== undefined && addForm.classHours !== '') {
                            params.append('classHours', addForm.classHours);
                        }
                        if (addForm.note.trim()) {
                            params.append('note', addForm.note.trim());
                        }

                        const response = await fetch('/course/add', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/x-www-form-urlencoded'
                            },
                            body: params.toString()
                        });

                        if (!response.ok) {
                            const text = await response.text();
                            throw new Error(text || '新增失败');
                        }

                        ElMessage.success('新增课程成功');
                        dialogVisible.value = false;
                        await loadAll(1);
                    } catch (err) {
                        setError('新增课程失败: ' + err.message);
                    } finally {
                        submitLoading.value = false;
                    }
                });
            }

            async function deleteCourses(courseNos, successMsg, errorMsg, exitBatchMode = false) {
                setError('');
                try {
                    const response = await fetch('/course/delete', {
                        method: 'DELETE',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(courseNos)
                    });

                    if (!response.ok) {
                        const text = await response.text();
                        throw new Error(text || errorMsg);
                    }

                    const data = await response.json();
                    if (data.code === 1) {
                        ElMessage.success(data.data || successMsg);
                        if (exitBatchMode) {
                            batchMode.value = false;
                            selectedCourses.value = [];
                        }
                        await loadAll(currentPage.value);
                    } else {
                        setError(data.msg || errorMsg);
                    }
                } catch (err) {
                    setError(errorMsg + ': ' + err.message);
                }
            }

            async function deleteCourse(courseNo) {
                if (!courseNo) {
                    ElMessage.warning('课程编号不能为空');
                    return;
                }

                try {
                    await ElMessageBox.confirm('确定要删除课程 ' + courseNo + ' 吗？', '删除确认', {
                        confirmButtonText: '确定',
                        cancelButtonText: '取消',
                        type: 'warning'
                    });
                    await deleteCourses([courseNo], '删除课程成功', '删除课程失败');
                } catch (err) {
                    if (err !== 'cancel') {
                        setError('删除课程失败: ' + err.message);
                    }
                }
            }

            function handleSelectionChange(selection) {
                selectedCourses.value = selection;
            }

            function toggleBatchMode() {
                batchMode.value = !batchMode.value;
                selectedCourses.value = [];
            }

            async function handleBatchBtn() {
                if (!batchMode.value) {
                    toggleBatchMode();
                    return;
                }

                const courseNos = selectedCourses.value.map(course => course.courseNo);
                if (courseNos.length === 0) {
                    ElMessage.warning('请先选择要删除的课程');
                    return;
                }

                try {
                    await ElMessageBox.confirm('确定要删除选中的 ' + courseNos.length + ' 门课程吗？', '批量删除确认', {
                        confirmButtonText: '确定',
                        cancelButtonText: '取消',
                        type: 'warning'
                    });
                    await deleteCourses(courseNos, '批量删除成功', '批量删除失败', true);
                } catch (err) {
                    if (err !== 'cancel') {
                        setError('批量删除失败: ' + err.message);
                    }
                }
            }

            onMounted(() => {
                loadAll(1);
            });

            return {
                pageSize,
                currentPage,
                total,
                courses,
                loading,
                submitLoading,
                batchMode,
                searching,
                error,
                dialogVisible,
                addFormRef,
                searchForm,
                addForm,
                addRules,
                loadAll,
                searchCourse,
                clearSearch,
                openAddDialog,
                resetAddForm,
                submitCourse,
                deleteCourse,
                handleSelectionChange,
                toggleBatchMode,
                handleBatchBtn
            };
        }
    }).use(ElementPlus).mount('#app');
</script>
</body>
</html>
