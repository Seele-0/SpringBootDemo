<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>学生信息展示</title>
    <style>
        body {
            font-family: "Microsoft YaHei", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
            background-color: #f5f5f5;
        }
        h1 {
            color: #333;
        }
        table {
            border-collapse: collapse;
            width: 90%;
            max-width: 1100px;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px 16px;
            text-align: center;
        }
        th {
            background-color: #409EFF;
            color: #fff;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        tr:hover {
            background-color: #ecf5ff;
        }
        .error {
            color: #f56c6c;
            margin-top: 20px;
        }
        .search-box {
            margin-bottom: 20px;
            width: 90%;
            max-width: 1100px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: nowrap;
        }
        .search-box label {
            display: flex;
            align-items: center;
            font-size: 14px;
            color: #606266;
            white-space: nowrap;
        }
        .search-box input {
            width: 160px;
            padding: 8px 12px;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            font-size: 14px;
        }
        .search-box button {
            padding: 8px 16px;
            background-color: #409EFF;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
        }
        .search-box button:hover {
            background-color: #66b1ff;
        }
        .search-box select {
            padding: 8px 12px;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            font-size: 14px;
            background-color: #fff;
        }
    </style>
</head>
<body>
    <h1>学生信息列表</h1>
    <div class="search-box">
        <label for="searchSno">学号：</label>
        <input type="text" id="searchSno" placeholder="请输入学号">
        <label for="searchName">姓名：</label>
        <input type="text" id="searchName" placeholder="请输入学生姓名">
        <label for="searchClass">班级：</label>
        <select id="searchClass">
            <option value="">全部班级</option>
            <option value="2023计算机科学与技术五">2023计算机科学与技术五</option>
            <option value="2023计算机科学与技术六">2023计算机科学与技术六</option>
        </select>
        <button onclick="searchStudent()">查询</button>
        <button onclick="clearSearch()" style="background-color: #909399;">清除</button>
    </div>
    <table>
        <thead>
            <tr>
                <th>学号</th>
                <th>姓名</th>
                <th>学院</th>
                <th>专业</th>
                <th>班级</th>
                <th>入学年份</th>
                <th>头像</th>
                <th>备注</th>
            </tr>
        </thead>
        <tbody id="studentBody"></tbody>
    </table>
    <p class="error" id="error"></p>

    <script>
        function renderStudent(s) {
            return `
                <td>${s.sno}</td>
                <td>${s.name}</td>
                <td>${s.college}</td>
                <td>${s.major}</td>
                <td>${s.className}</td>
                <td>${s.registerYear}</td>
                <td>${s.avatar}</td>
                <td>${s.note}</td>
            `;
        }

        function loadAll() {
            document.getElementById('error').textContent = '';
            fetch('/students/show')
                .then(response => response.json())
                .then(data => {
                    const tbody = document.getElementById('studentBody');
                    tbody.innerHTML = '';
                    data.forEach(s => {
                        const row = document.createElement('tr');
                        row.innerHTML = renderStudent(s);
                        tbody.appendChild(row);
                    });
                })
                .catch(err => {
                    document.getElementById('error').textContent = '加载数据失败: ' + err;
                });
        }

        function clearSearch() {
            document.getElementById('searchSno').value = '';
            document.getElementById('searchName').value = '';
            document.getElementById('searchClass').value = '';
            loadAll();
        }

        function searchStudent() {
            const sno = document.getElementById('searchSno').value.trim();
            const name = document.getElementById('searchName').value.trim();
            const className = document.getElementById('searchClass').value;
            if (!sno && !name && !className) {
                document.getElementById('error').textContent = '请输入查询条件';
                return;
            }
            document.getElementById('error').textContent = '';
            const params = new URLSearchParams();
            if (sno) params.append('sno', sno);
            if (name) params.append('name', name);
            if (className) params.append('className', className);
            fetch('/students/search?' + params.toString())
                .then(response => response.json())
                .then(data => {
                    const tbody = document.getElementById('studentBody');
                    tbody.innerHTML = '';
                    if (data && data.length > 0) {
                        data.forEach(s => {
                            const row = document.createElement('tr');
                            row.innerHTML = renderStudent(s);
                            tbody.appendChild(row);
                        });
                    } else {
                        document.getElementById('error').textContent = '未找到该学生';
                    }
                })
                .catch(err => {
                    document.getElementById('error').textContent = '查询失败: ' + err;
                });
        }

        loadAll();
    </script>
</body>
</html>
